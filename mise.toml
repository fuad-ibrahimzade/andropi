# Project-local toolchain for AndroPI.
# The tools below are only active inside this checkout (`mise install` /
# `mise exec` / a mise-enabled shell), so the machine's global environment
# stays untouched.

[tools]
# Flutter app: Dart SDK ^3.13.4 (3.47.9 ships Dart 3.13.7).
flutter = "3.47.9"
# Android builds need a JDK that Gradle/AGP supports.
java = "temurin-17"
# Android command-line tools (sdkmanager, avdmanager); ANDROID_HOME points at
# the install, see [env].
android-sdk = "23.0"
# agent(): bundles the pi host. pi needs Node >= 22.19.
node = "22"
# tool/bundle_runtime.py (with `lief`) repackages the Termux runtime.
python = "3.12"
# Desktop releases (`mise run release`) run CMake + Ninja for the Windows and
# Linux runners. Pinned here so both hosts get them from this checkout only;
# on Linux the GTK 3 development libraries come from the distro itself.
cmake = "3.31.12"
ninja = "1.13.2"

# `mise run check` -> analyze + test with the versions above.
[tasks.check]
run = ["flutter analyze", "flutter test"]

# `mise run release` -> build and package the desktop app for the host it
# runs on. Run it on Windows for the Windows build, inside the WSL distro
# for the Linux build:
#   release/andropi-<version>-windows-x64.zip
#   release/andropi-<version>-linux-x64.tar.gz
[tasks.release]
description = "Build + package the desktop release for this host"
run = "dart tool/release.dart"